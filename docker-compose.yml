services:
  db:
    image: postgres:15-alpine
    container_name: malaka_db
    restart: always
    # App pool (60) + guard/scripts + zaxira. 1000+ parallel foydalanuvchi
    # uchun default 100 kam bo'lishi mumkin.
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POSTGRES_DB: ${POSTGRES_DB:-malaka}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-malaka}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    container_name: malaka_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override .env's localhost so the app reaches the db container
      POSTGRES_HOST: db
    volumes:
      # Uploaded files (books etc.) must survive image rebuilds
      - media_data:/project/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 18+ rasm aniqlash guard boti (@tozakanal_bot) — hozircha kerak emas,
  # `profiles`ga tayinlab qo'ydik. Kerak bo'lganda:
  #     docker compose --profile guard up -d
  # bilan ishga tushiring. Oddiy `docker compose up -d` bunga tegmaydi.
  guard:
    profiles: ["guard"]
    build: .
    container_name: malaka_guard
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    working_dir: /project/app
    # entrypoint.sh (uvicorn) o'rniga guard botni to'g'ridan-to'g'ri ishga tushiramiz
    entrypoint: ["python", "-m", "guard.main"]
    volumes:
      # Flag rasmlari app bilan umumiy media'da (admin panel ko'rsatishi uchun)
      - media_data:/project/app/media
    # Image'dagi HEALTHCHECK web server uchun — guard'da web yo'q, o'chiramiz
    healthcheck:
      disable: true

volumes:
  postgres_data:
  media_data:
